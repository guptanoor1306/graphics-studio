name: Python 3.10 check
# Railway runs on the Docker image's Python 3.10: every file must compile there.
on: [push, pull_request]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m compileall -q -x '(\.venv|node_modules)' .
