# Render Blueprint: https://render.com/docs/blueprint-spec
databases:
  - name: graphics-studio-db
    plan: free
    databaseName: graphics_studio
    user: graphics_studio

services:
  - type: web
    name: graphics-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STUDIO_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: graphics-studio-db
          property: connectionString
