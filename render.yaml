# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: graphics-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STUDIO_URL
        sync: false
    disk:
      name: graphics-studio-data
      mountPath: /app/data
      sizeGB: 1
